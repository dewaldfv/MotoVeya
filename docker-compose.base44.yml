services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"fetch('http://localhost:5173/').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
